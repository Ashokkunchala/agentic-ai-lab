[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-lab"
version = "1.0.0"
description = "A from-scratch to production curriculum for building AI agents, with runnable lessons, diagrams and notes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashok Kunchala" }]
keywords = ["ai", "agents", "llm", "curriculum", "mcp", "observability"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]

dependencies = [
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.urls]
Homepage = "https://github.com/Ashokkunchala/agentic-ai-lab"
Repository = "https://github.com/Ashokkunchala/agentic-ai-lab"
Documentation = "https://github.com/Ashokkunchala/agentic-ai-lab#readme"
Issues = "https://github.com/Ashokkunchala/agentic-ai-lab/issues"

[tool.setuptools]
packages = ["shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "slow: spawns a subprocess or writes files",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", ".runs", "node_modules"]

[tool.ruff.lint]
# Keep the baseline focused on correctness. Extra modernization and style rules
# can be introduced after older lesson examples are cleaned up incrementally.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"0*-*/**.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["shared"]
strict = false
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["shared.model"]
disallow_untyped_defs = false
